name: Build and publish VaultPass
on:
  push:
    branches: [main]
    paths: ['Dockerfile', '.github/workflows/build.yml']
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: vaultpass-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/jbkunama1/hai.vaultpass:latest
            ghcr.io/jbkunama1/hai.vaultpass:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/jbkunama1/hAI.VaultPass
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
